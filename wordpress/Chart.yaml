apiVersion: v2
name: wordpress
description: A Helm chart for Wordpress on Kubernetes with NGINX and PHP-FPM
type: application
version: 0.1.44
appVersion: "7.1.3"
dependencies:
  - name: mariadb
    version: "24.2.0"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: mariadb.enabled
  - name: redis
    version: "28.3.9"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
